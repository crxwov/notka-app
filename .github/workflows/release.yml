name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 35
        run: |
          echo "y" | & $env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat "platforms;android-35"

      - name: Build and Sign APK
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File android/build.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/build/dist/notka.apk
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
