<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Нотка — Офлайн</title>
  <style>
    :root {
      --bg: #0C0A12;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #F3F3F7;
      --text-muted: #8E8B9E;
      --accent: #8B5CF6;
      --accent-glow: rgba(139, 92, 246, 0.35);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .ambient {
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      filter: blur(40px);
      pointer-events: none;
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .icon-wrapper {
      width: 72px;
      height: 72px;
      border-radius: 24px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .icon-wrapper svg {
      width: 36px;
      height: 36px;
      fill: none;
      stroke: var(--accent);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-muted);
      margin-bottom: 28px;
    }
    .retry-btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 16px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 20px var(--accent-glow);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .retry-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }
    .settings-link {
      margin-top: 18px;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="ambient"></div>
  <div class="container">
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Нет подключения к сети</h1>
    <p>Проверьте интернет-соединение. Нотка автоматически загрузит приложение, как только появится связь.</p>
    <button class="retry-btn" onclick="retryConnection()">
      Повторить попытку
    </button>
  </div>

  <script>
    function retryConnection() {
      if (window.NotkaAndroid && window.NotkaAndroid.hapticImpact) {
        window.NotkaAndroid.hapticImpact("medium");
      }
      if (window.NotkaAndroid && window.NotkaAndroid.reload) {
        window.NotkaAndroid.reload();
      } else if (window.NotkaAndroid && window.NotkaAndroid.getAppUrl) {
        window.location.href = window.NotkaAndroid.getAppUrl();
      } else {
        window.location.href = "https://notka.duckdns.org/app/?source=android";
      }
    }

    // Auto-retry when internet comes back online
    window.addEventListener('online', function() {
      retryConnection();
    });
  </script>
</body>
</html>
