<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Нотка — Нет связи</title>
  <style>
    :root {
      --bg: #1A0B16;
      --ground: #13080F;
      --surface-1: rgba(255, 233, 223, 0.055);
      --surface-2: rgba(255, 233, 223, 0.09);
      --line: rgba(255, 233, 223, 0.11);
      --text: #FFF1EA;
      --text-2: rgba(255, 241, 234, 0.66);
      --c-core: #FFE9DF;
      --c-warm: #FFA6B8;
      --c-mid: #FF4FA0;
      --c-deep: #44112F;
      --btn-light: linear-gradient(150deg, #FFFFFF 0%, #FFF4EE 45%, #FFD7DF 100%);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: radial-gradient(circle at 50% 24%, rgba(68, 17, 47, 0.72) 0%, var(--ground) 64%);
      background-color: var(--ground);
      color: var(--text);
      font-family: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .ambient {
      position: fixed;
      top: 22%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      height: 280px;
      background: radial-gradient(circle at 38% 34%, var(--c-core) 0%, var(--c-warm) 28%, var(--c-mid) 56%, transparent 74%);
      opacity: 0.24;
      filter: blur(46px);
      pointer-events: none;
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 340px;
      padding: 28px 22px 22px;
      border-radius: 32px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03) 40%),
        linear-gradient(135deg, rgba(64, 34, 52, 0.62), rgba(24, 14, 24, 0.86));
      box-shadow:
        inset 0 1px 0.5px rgba(255, 255, 255, 0.32),
        inset 0 0 0 0.5px rgba(255, 255, 255, 0.14),
        0 30px 70px -20px rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .orb {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: radial-gradient(circle at 36% 30%, var(--c-core) 0 12%, var(--c-warm) 36%, var(--c-mid) 66%, var(--c-deep) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px -8px rgba(255, 79, 160, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.5);
    }
    .orb svg {
      width: 30px;
      height: 30px;
      fill: none;
      stroke: var(--bg);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    p {
      font-size: 15px;
      line-height: 1.45;
      color: var(--text-2);
      margin-bottom: 22px;
    }
    .retry-btn {
      width: 100%;
      height: 50px;
      padding: 0 24px;
      border-radius: 999px;
      background: var(--btn-light);
      color: var(--bg);
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s;
    }
    .retry-btn:active {
      transform: scale(0.97);
      opacity: 0.92;
    }
  </style>
</head>
<body>
  <div class="ambient"></div>
  <div class="container">
    <div class="orb">
      <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Нет подключения к сети</h1>
    <p>Проверьте интернет-соединение. Нотка загрузится автоматически, как только появится связь.</p>
    <button class="retry-btn" onclick="retryConnection()">Повторить</button>
  </div>

  <script>
    function retryConnection() {
      if (window.NotkaAndroid && window.NotkaAndroid.hapticImpact) {
        window.NotkaAndroid.hapticImpact("medium");
      }
      if (window.NotkaAndroid && window.NotkaAndroid.reload) {
        window.NotkaAndroid.reload();
      } else if (window.NotkaAndroid && window.NotkaAndroid.getAppUrl) {
        window.location.href = window.NotkaAndroid.getAppUrl();
      } else {
        window.location.href = "https://notka.site/app/?source=android";
      }
    }

    window.addEventListener('online', function() {
      retryConnection();
    });
  </script>
</body>
</html>
